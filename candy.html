<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANDY - NANOPIPIS</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
    }

    header {
      background-color: #111;
      color: #fff;
      padding: 1rem 2rem;
      text-align: center;
    }

    .btn-volver {
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    /* Layout principal de producto */
    .product-container {
      max-width: 1000px;
      margin: 2rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    /* Galería de imágenes */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .main-img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 8px;
    }

    .thumbnails {
      display: flex;
      gap: 0.5rem;
    }

    .thumb {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.6;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .thumb:hover, .thumb.active {
      opacity: 1;
      border-color: #111;
    }

    /* Detalles y opciones */
    .product-details {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-title {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-size: 1.5rem;
      font-weight: 700;
      color: #25d366;
      margin-bottom: 1.5rem;
    }

    .option-group {
      margin-bottom: 1.2rem;
    }

    .option-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .option-group select {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      background-color: #fff;
    }

    .btn-whatsapp {
      display: block;
      text-align: center;
      background-color: #25d366;
      color: #fff;
      text-decoration: none;
      padding: 1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      transition: background-color 0.2s;
      margin-top: 1rem;
    }

    .btn-whatsapp:hover {
      background-color: #1eb857;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-volver">← Volver al catálogo</a>
    <h1>NANOPIPIS</h1>
  </header>

  <main class="product-container">
    
    <!-- GALERÍA DE IMÁGENES -->
    <div class="gallery">
      <!-- Imagen principal -->
      <img src="img/zapato3-1.jpg" id="imagen-principal" class="main-img" alt="CANDY">
      
      <!-- Miniaturas para cambiar la foto principal -->
      <div class="thumbnails">
        <img src="img/zapato3-1.jpg" class="thumb active" onclick="cambiarImagen(this.src)">
        <img src="img/zapato3-2.jpg" class="thumb" onclick="cambiarImagen(this.src)">
        <img src="img/zapato3-3.jpg" class="thumb" onclick="cambiarImagen(this.src)">
      </div>
    </div>

    <!-- DETALLES Y OPCIONES -->
    <div class="product-details">
      <div>
        <h2 class="product-title" style="color: #000000;">CANDY</h2>
        <p class="product-price">$250.000 COP</p>

        <!-- Selector de Color -->
        <div class="option-group">
          <label for="color">Selecciona el Color:</label>
          <select id="color" onchange="actualizarBotonWhatsApp()">
            <option value="Marrón">Marrón</option>
            <option value="Negro">Negro</option>
          </select>
        </div>

        <!-- Selector de Talla -->
        <div class="option-group">
          <label for="talla">Selecciona la Talla:</label>
          <select id="talla" onchange="actualizarBotonWhatsApp()">
            <option value="39">39</option>
            <option value="40">40</option>
            <option value="41">41</option>
          </select>
        </div>
      </div>

      <!-- BOTÓN DINÁMICO DE WHATSAPP -->
      <a href="#" id="btn-wa" target="_blank" class="btn-whatsapp">
        Comprar por WhatsApp
      </a>
    </div>

  </main>

  <script>
    // TU NÚMERO DE WHATSAPP (Con código de país, ej: 57 para Colombia)
    const numeroTelefono = "573113120300"; 
    const nombreProducto = "CANDY";

    // 1. Función para cambiar la imagen principal al hacer clic en las miniaturas
    function cambiarImagen(src) {
      document.getElementById('imagen-principal').src = src;
    }

    // 2. Función para armar el mensaje de WhatsApp según las opciones elegidas
    function actualizarBotonWhatsApp() {
      const colorSeleccionado = document.getElementById('color').value;
      const tallaSeleccionada = document.getElementById('talla').value;

      // Mensaje estructurado
      const mensaje = `Hola! Estoy interesado en comprar el *${nombreProducto}* en Color: *${colorSeleccionado}* y Talla: *${tallaSeleccionada}*.`;

      // Encodificar mensaje para la URL
      const urlWhatsApp = `https://wa.me/${numeroTelefono}?text=${encodeURIComponent(mensaje)}`;

      // Asignar al botón
      document.getElementById('btn-wa').href = urlWhatsApp;
    }

    // Ejecutar al cargar la página por primera vez
    actualizarBotonWhatsApp();
  </script>

</body>
</html>
